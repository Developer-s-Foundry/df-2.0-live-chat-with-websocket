<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- Login Form -->
            <form id="login-form">
                <h2>Login</h2>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Login</button>
                <div class="toggle-text">Don't have an account? <a onclick=toggleForms()>Register</a></div>
            </form>

            <!-- Register Form -->
            <form id="register-form">
                <h2>Register</h2>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit">Register</button>
                <div class="toggle-text">Already have an account? <a onclick="toggleForms()">Login</a></div>
            </form>
        </div>

        <div class="info-section">
            <h1>Welcome to Customer Support</h1>
            <p>Connect with our Customer Agent in Realtime and get your queries resolved instantly.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
